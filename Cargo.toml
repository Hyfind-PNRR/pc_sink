[workspace]
resolver = "2"
members = [
    "crates/hyfind-core",
    "crates/hyfind-store",
    "crates/hyfind-ble",
    "src-tauri",
]

[workspace.dependencies]
# Error handling
anyhow    = "1"
thiserror = "2"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

# Serialisation
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Observability
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# BLE
btleplug = "0.11"

# Persistence (bundled = compiles SQLite from source; no system SQLite required on Windows)
rusqlite = { version = "0.32", features = ["bundled"] }

# Tauri
tauri       = "2"
tauri-build = "2"

# Internal crates
hyfind-core  = { path = "crates/hyfind-core" }
hyfind-store = { path = "crates/hyfind-store" }
hyfind-ble   = { path = "crates/hyfind-ble" }

# Testing
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Relaxed pedantic lints — rationale in PR notes.
module_name_repetitions = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
