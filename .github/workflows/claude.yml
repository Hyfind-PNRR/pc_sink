name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Rust toolchain so the agent can actually build/lint/format/test its own work.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Cache target/ and the registry to keep cold builds inside the turn budget.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Allows Claude to read CI results on PRs (e.g. the `ci` job below).
          additional_permissions: |
            actions: read

          # claude_args:
          # - allowedTools: gh + file edits + every cargo verb the issues require + ripgrep
          #   (rg is used for the "first action" anchor and for grep-verifiable acceptance criteria).
          # - max-turns: Rust's edit-compile-borrowck cycle burns turns; 40 for moderate refactors.
          # - model: Opus for non-trivial trait/ownership/API design (Actions defaults to Sonnet).
          claude_args: |
            --model claude-opus-4-8
            --max-turns 40
            --allowedTools "Bash(gh *),Write,Edit,MultiEdit,Bash(cargo build *),Bash(cargo test *),Bash(cargo clippy *),Bash(cargo fmt *),Bash(cargo check *),Bash(rg *)"